name: xiazhi

channels:
  - conda-forge

dependencies:
  - python=3.12
  # Tkinter GUI for the offline U-Arm joint slider window.
  - tk
  - pip>=24
  - ffmpeg>=7,<8
  - numpy>=2.0,<2.3
  - pillow>=10,<13
  - pyserial>=3.5,<4
  # FK 的 PyKDL Python 绑定，由 Conda 安装对应 Python 3.12 的二进制包。
  - python-orocos-kdl>=1.5.4,<1.6
  - lxml
  - pyyaml
  - pip:
      # 始终安装当前 submodule 中的最新 LeRobot 实现，由它解析兼容的
      # torch/av/datasets/draccus 等版本，避免沿用 rm-collect 0.5.2 的冲突锁定。
      - "-e ./third_party/lerobot[dataset_viz]"
      # 目录浏览使用 0.33 的本地 catalog server，按需读取 RRD。
      - "rerun-sdk[catalog]>=0.33.0,<0.34.0"
      # URDF -> KDL；官方 kdl_parser_py 3.0.0 固定到发布提交。
      - urdf-parser-py==0.0.4
      - "kdl-parser-py @ git+https://github.com/ros/kdl_parser_py.git@9f80c4a2f7e8e15b7e421da74e5dcef1fdf7fd3a"

      # MCAP 离线读取不依赖 ROS Python 绑定；DB3 仍由 Humble 系统工具转换。
      - "mcap>=1.2,<2"
      - "mcap-ros2-support>=0.5,<1"
