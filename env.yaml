name: xiazhi

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip>=24
  - ffmpeg>=7,<8
  - numpy>=2.0,<2.3
  - pillow>=10,<13
  - pip:
      # 始终安装当前 submodule 中的最新 LeRobot 实现，由它解析兼容的
      # torch/av/datasets/draccus 等版本，避免沿用 rm-collect 0.5.2 的冲突锁定。
      - "-e ./third_party/lerobot[dataset_viz]"

      # requirements_drag_teach.txt 中与当前无 VR、无手柄实现仍相关的硬件依赖。
      - robotic-arm==1.1.5
      - pyorbbecsdk2==2.1.1
